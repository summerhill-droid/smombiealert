kind = "mobile"
previewPath = "/"
title = "Smombie Detector"
version = "1.0.0"
id = "artifacts/smombie-detector"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22801

[services.development]
run = "pnpm --filter @workspace/smombie-detector run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smombie-detector", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/smombie-detector", "run", "serve" ]

[services.env]
PORT = "22801"
BASE_PATH = "/"
